services:
  # pgvector/pgvector:pg16, resmi postgres:16 imajının ÜZERİNE pgvector
  # uzantısını ekleyen resmi bir varyanttır (aynı Debian tabanı, aynı veri
  # formatı) — var olan `postgres_data` volume'ü ile birebir uyumludur,
  # veri kaybı olmadan bu imaja geçilebilir. Vektör depolama artık ayrı bir
  # ChromaDB servisi DEĞİL, bu veritabanının içindeki `clothing_item_embeddings`
  # tablosudur (bkz. CLAUDE.md §9, 2026-08-27 kaydı — "ChromaDB'den pgvector'a
  # geçiş").
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dijital_gardirop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
